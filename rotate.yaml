# rotate config for .github/workflows/rotate-alert.yml. The workflow reads it
# from the default branch only: it decides where rotate sends requests.
overlap_window: 5m
consumers:
  github_actions:
    # Actions secrets named by convention (AWS_SECRET_ACCESS_KEY,
    # AWS_ACCESS_KEY_ID, GH_TOKEN, GH_PAT, NPM_TOKEN, OPENAI_API_KEY).
    targets: [smhasan94/rotate-live]
